{% extends "base.html" %}

{% block extrahead %}
  <link rel="icon" href="{{ config.site_url }}assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{ config.site_url }}assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ config.site_url }}assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title if page.title != 'Home' else config.site_name }}: parallel simulation experiments on a personal computer">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
