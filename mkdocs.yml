site_name: simstreams
site_url: https://ismayc.github.io/simstreams-python/
site_description: >-
  Parallel simulation experiments on a personal computer: spawned SeedSequence
  streams, the replications divided evenly, and the worker as an argument.
  The Python companion to the Eubank and Ismay book.
repo_url: https://github.com/ismayc/simstreams-python
repo_name: ismayc/simstreams-python
edit_uri: ""
copyright: MIT, Randall L. Eubank and Chester Ismay

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Reference:
      - Run a simulation: reference/template.md
      - The book's workers: reference/workers.md
      - Workers that communicate: reference/coupled.md
      - The epidemic case study: reference/epidemic.md
      - Timing: reference/benchmark.md
      - The toy generator: reference/pcg8.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
