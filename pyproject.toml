[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simstreams"
version = "0.1.0"
description = "Parallel simulation experiments on a personal computer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Chester Ismay", email = "chester.ismay@gmail.com" },
  { name = "Randall L. Eubank" },
]
keywords = ["simulation", "parallel", "multiprocessing", "monte-carlo", "pcg64"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/ismayc/simstreams-python"
Repository = "https://github.com/ismayc/simstreams-python"
Issues = "https://github.com/ismayc/simstreams-python/issues"
Book = "https://parallel-simulation-book.netlify.app"
"R package" = "https://github.com/ismayc/simstreams"

[dependency-groups]
dev = [
    "matplotlib>=3.7",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simstreams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=simstreams --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
